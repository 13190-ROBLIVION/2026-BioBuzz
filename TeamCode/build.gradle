apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }
    namespace = 'org.firstinspires.ftc.teamcode'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging = true
    }
    compileSdkMinor = 0

    // Pure-Java module: disable AGP 9's built-in Kotlin support (the supported
    // per-module opt-out) so the Kotlin Gradle plugin isn't applied at all.
    // This avoids KGP-internal Gradle deprecation warnings (Configuration.setVisible)
    // and skips unneeded Kotlin compile setup. Remove this line if Kotlin sources
    // are ever added to this module.
    enableKotlin = false
}

// Compile with a JDK 17 toolchain instead of whatever JDK runs Gradle
// (AGP's recommended fix for the "source/target 8 is obsolete" warnings on
// modern JDKs). Source/target stay at Java 8 - the level the FTC SDK supports -
// while javac 17 doesn't emit the obsolete-option warnings that javac 21+ does.
// The foojay resolver in settings.gradle auto-provisions JDK 17 if needed.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation project(':FtcRobotController')
}
