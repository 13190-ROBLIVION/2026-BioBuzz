# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Allow Gradle to use up to 1 GB of RAM
org.gradle.jvmargs=-Xmx1024M

# Keep R classes transitive (FTC SDK style) so TeamCode can reference resources
# from any AAR it depends on.
android.nonTransitiveRClass=false

# The old AGP 8.13 behavior-preservation flags that used to live here were removed
# so the project adopts the AGP 9 defaults instead of pinning deprecated opt-outs:
#   android.defaults.buildfeatures.resvalues=true
#   android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
#   android.enableAppCompileTimeRClass=false
#   android.usesSdkInManifest.disallowed=false
#   android.uniquePackageNames=false
#   android.dependency.useConstraints=true   (removing this also kills the 8
#        LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED sync warnings)
#   android.r8.strictFullModeForKeepRules=false
#   android.r8.optimizedResourceShrinking=false
#   android.builtInKotlin=false
#   android.newDsl=false
# Verified safe for this project: no <uses-sdk> in any manifest, targetSdkVersion
# is set explicitly (build.common.gradle), no R fields in switch cases, no
# resValue DSL usage, no Kotlin sources, no legacy variant API usage, no
# resource shrinking/minification, and unique library namespaces.
# See https://developer.android.com/build/releases/past-releases/agp-9-0-0-release-notes
org.gradle.configuration-cache=true
